<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1424" viewBox="0 0 1100 1424"><rect width="1100" height="1424" fill="#faf8f2"/><rect width="1100" height="315" fill="#0d1b2d"/><text x="40" y="82" font-family="Georgia" font-weight="bold" font-size="53" fill="#fff">HOW TO KNOW WHEN</text><text x="40" y="143" font-family="Georgia" font-weight="bold" font-size="53" fill="#fff">IT'S TIME FOR A</text><text x="40" y="213" font-family="Georgia" font-weight="bold" font-size="67" fill="#edc778">PRICE REDUCTION</text><text x="43" y="259" font-family="Arial" font-size="21" fill="#fff">Buyers shop online first. Showings reveal whether your price is</text><text x="43" y="286" font-family="Arial" font-size="21" fill="#fff">close enough to earn a place on their in-person tour list.</text><rect x="22" y="343" width="1056" height="80" rx="16" fill="#e6be72"/><text x="550" y="397" font-family="Georgia" font-size="47" text-anchor="middle" fill="#10243a">THE SELLER'S RULES</text><rect x="24" y="451" width="337" height="298" rx="13" fill="#e2f4e2" stroke="#21733b" stroke-width="2"/><circle cx="58" cy="489" r="24" fill="#21733b"/><text x="58" y="498" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="white">1</text><text x="192" y="550" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#0d1b2d">2–3 SHOWINGS PER WEEK</text><text x="192" y="587" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#21733b">GOOD SIGN</text><text x="42" y="627" font-family="Arial" font-size="20" fill="#223146">Your price may be close enough to</text><text x="42" y="653" font-family="Arial" font-size="20" fill="#223146">attract buyers. Monitor activity</text><text x="42" y="679" font-family="Arial" font-size="20" fill="#223146">and competing listings.</text><rect x="384" y="451" width="337" height="298" rx="13" fill="#fff3d6" stroke="#ab7100" stroke-width="2"/><circle cx="418" cy="489" r="24" fill="#ab7100"/><text x="418" y="498" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="white">2</text><text x="552" y="550" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#0d1b2d">2–3 SHOWINGS WEEKLY, NO OFFER</text><text x="552" y="587" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#ab7100">CAUTION</text><text x="402" y="627" font-family="Arial" font-size="20" fill="#223146">After three weeks, steady tours</text><text x="402" y="653" font-family="Arial" font-size="20" fill="#223146">but no offers may indicate better</text><text x="402" y="679" font-family="Arial" font-size="20" fill="#223146">competing values.</text><rect x="744" y="451" width="337" height="298" rx="13" fill="#ffe5e5" stroke="#b62427" stroke-width="2"/><circle cx="778" cy="489" r="24" fill="#b62427"/><text x="778" y="498" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="white">3</text><text x="912" y="550" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#0d1b2d">ONLY 1 SHOWING IN 2 WEEKS</text><text x="912" y="587" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#b62427">OVERPRICING WARNING</text><text x="762" y="627" font-family="Arial" font-size="20" fill="#223146">Too few tours suggest buyers are</text><text x="762" y="653" font-family="Arial" font-size="20" fill="#223146">excluding the home before they</text><text x="762" y="679" font-family="Arial" font-size="20" fill="#223146">visit.</text><rect x="24" y="771" width="337" height="298" rx="13" fill="#e4effb" stroke="#2c5375" stroke-width="2"/><circle cx="58" cy="809" r="24" fill="#2c5375"/><text x="58" y="818" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="white">4</text><text x="192" y="870" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#0d1b2d">NO AGENT FEEDBACK</text><text x="192" y="907" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#2c5375">LOOK AT THE PATTERN</text><text x="42" y="947" font-family="Arial" font-size="20" fill="#223146">Silence alone is inconclusive;</text><text x="42" y="973" font-family="Arial" font-size="20" fill="#223146">combined with low traffic,</text><text x="42" y="999" font-family="Arial" font-size="20" fill="#223146">investigate demand.</text><rect x="384" y="771" width="337" height="298" rx="13" fill="#fff0df" stroke="#b35f12" stroke-width="2"/><circle cx="418" cy="809" r="24" fill="#b35f12"/><text x="418" y="818" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="white">5</text><text x="552" y="870" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#0d1b2d">PRICE CUTS UNDER 2%</text><text x="552" y="907" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#b35f12">MAY NOT REPOSITION</text><text x="402" y="947" font-family="Arial" font-size="20" fill="#223146">Small reductions may not reach new</text><text x="402" y="973" font-family="Arial" font-size="20" fill="#223146">buyers or correct a large value</text><text x="402" y="999" font-family="Arial" font-size="20" fill="#223146">gap.</text><rect x="744" y="771" width="337" height="298" rx="13" fill="#fbecd0" stroke="#986800" stroke-width="2"/><circle cx="778" cy="809" r="24" fill="#986800"/><text x="778" y="818" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="white">6</text><text x="912" y="870" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#0d1b2d">A MEANINGFUL REPOSITION</text><text x="912" y="907" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#986800">REVIEW COMPS FIRST</text><text x="762" y="947" font-family="Arial" font-size="20" fill="#223146">A 3–5% adjustment may help in some</text><text x="762" y="973" font-family="Arial" font-size="20" fill="#223146">cases, but the comps—not a</text><text x="762" y="999" font-family="Arial" font-size="20" fill="#223146">rule—set the target.</text><rect x="22" y="1099" width="1056" height="188" rx="15" fill="#e9edf2" stroke="#b9a071" stroke-width="2"/><text x="45" y="1141" font-family="Georgia" font-size="30" font-weight="bold" fill="#0d1b2d">THE MARKET DECODER</text><text x="45" y="1180" font-family="Arial" font-size="21" fill="#17482a">●  2+ first-week showings, no offer = Wait and monitor</text><text x="45" y="1221" font-family="Arial" font-size="21" fill="#8d600a">●  2–3 weekly showings after 3 weeks, no offer = Reassess price</text><text x="45" y="1262" font-family="Arial" font-size="21" fill="#a4242d">●  0–1 showings per week = Investigate overpricing</text><rect y="1308" width="1100" height="116" fill="#0d1b2d"/><text x="550" y="1362" font-family="Georgia" font-size="30" text-anchor="middle" fill="#e6be72">The market speaks in showings first, offers second.</text><text x="550" y="1400" font-family="Arial" font-size="21" text-anchor="middle" fill="#fff">Jeff Jones  |  Designated Broker  |  208Premier.com  |  FlatFeeBoise.com</text></svg>